<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 가계부</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1f2a24;--mut:#76807a;--line:#e6e4dc;--pri:#2f7d5b;--exp:#d2574a;--inc:#2f7d5b;--chip:#eef0ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151a17;--card:#1e2521;--tx:#eef2ee;--mut:#97a29b;--line:#2c3530;--pri:#4fb386;--exp:#ef7b6e;--inc:#4fb386;--chip:#29312c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151a17;--card:#1e2521;--tx:#eef2ee;--mut:#97a29b;--line:#2c3530;--pri:#4fb386;--exp:#ef7b6e;--inc:#4fb386;--chip:#29312c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding-bottom:96px}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.tabs{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:14px}
.tabs button,.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:10px;font-size:15px}
.tabs button.on,.seg button.on{background:var(--card);color:var(--tx);font-weight:700}
.mon{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 14px}
.mon b{font-size:18px}
.mon button{border:0;background:var(--chip);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:16px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.sum>small{color:var(--mut)}
.bal{font-size:28px;font-weight:700;margin:2px 0 10px}
.row{display:flex;gap:10px}
.row>div{flex:1;background:var(--chip);border-radius:12px;padding:10px 12px}
.row small{color:var(--mut);display:block}
.pays{color:var(--mut);font-size:13px;margin-top:10px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
h3{font-size:14px;color:var(--mut);margin:20px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.cat{padding:9px 0}
.cat .t{display:flex;justify-content:space-between;align-items:baseline}
.cat .t b{font-size:17px}
.bar{height:5px;border-radius:3px;background:var(--chip);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--exp);border-radius:3px}
.day{color:var(--mut);font-size:13px;margin:16px 4px 6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .m{flex:1;min-width:0}
.item .m div:last-child{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:600;white-space:nowrap}
.x{border:0;background:none;color:var(--mut);font-size:18px;padding:4px 6px}
.empty{color:var(--mut);text-align:center;padding:24px 0}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.sheet.top{z-index:30}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:12px}
input,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;font-size:16px;margin-bottom:10px;font-family:inherit}
#amt{font-size:24px;font-weight:700}
.lb{font-size:13px;color:var(--mut);margin:2px 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--tx);border-radius:18px;padding:7px 12px;font-size:14px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chips button.plus{border-style:dashed;color:var(--mut)}
.save{width:100%;border:0;background:var(--pri);color:#fff;font-size:16px;font-weight:700;padding:14px;border-radius:12px}
.note{background:var(--chip);color:var(--mut);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input,.addrow select{margin:0}
.addrow button{border:0;background:var(--pri);color:#fff;border-radius:12px;padding:0 16px;font-weight:700;white-space:nowrap}
.arow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border:0}
.arow input{margin:0;padding:9px 10px;font-size:15px}
.arow .nm{flex:1.1}.arow .vl{flex:1;text-align:right;font-weight:600}
.tag{font-size:11px;color:var(--exp);border:1px solid var(--exp);border-radius:8px;padding:0 5px;white-space:nowrap}
.more{width:100%;margin-top:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;font-size:14px}
.hide{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="tabs"><button id="tabL" class="on">가계부</button><button id="tabA">자산</button></div>
  <div id="note"></div>

  <div id="pgL">
    <div class="mon"><button id="prev" aria-label="이전 달">‹</button><b id="ml"></b><button id="next" aria-label="다음 달">›</button></div>
    <div class="sum">
      <small>이번 달 잔액</small>
      <div class="bal" id="bal">0원</div>
      <div class="row"><div><small>수입</small><b class="inc" id="si">0원</b></div><div><small>지출</small><b class="exp" id="se">0원</b></div></div>
      <div class="pays" id="pays"></div>
    </div>
    <h3>카테고리별 사용 금액</h3>
    <div class="card" id="cats"></div>
    <h3>내역</h3>
    <div id="list"></div>
    <h3>신용카드 결제 예정 금액</h3>
    <div class="card" id="sched"></div>
    <h3>엑셀 내보내기 · 백업</h3>
    <div class="card" style="padding:12px 14px">
      <button class="more" style="margin:0 0 8px" id="xM">엑셀로 저장</button>
      <button class="more" style="margin:0 0 8px" id="xA">전체 내역 엑셀로 저장 (월별 시트)</button>
      <button class="more" style="margin:0 0 8px" id="xB">백업 파일 저장 (.json)</button>
      <button class="more" style="margin:0" id="xR">백업 파일 불러오기</button>
      <input type="file" id="xF" accept=".json,application/json" class="hide">
      <div style="color:var(--mut);font-size:12px;margin-top:10px">폰을 바꾸거나 브라우저 데이터를 지울 때에 대비해 가끔 백업 파일을 저장해두세요.</div>
    </div>
  </div>

  <div id="pgA" class="hide">
    <div class="sum">
      <small>순자산</small>
      <div class="bal" id="net">0원</div>
      <div class="row"><div><small>자산</small><b class="inc" id="aT">0원</b></div><div><small>부채</small><b class="exp" id="dT">0원</b></div></div>
    </div>
    <h3>보유 자산 (금액을 눌러 수정)</h3>
    <div class="card" id="alist"></div>
    <div class="addrow">
      <input id="anm" type="text" placeholder="항목 이름" style="flex:1.2">
      <input id="aam" type="number" inputmode="numeric" placeholder="금액" style="flex:1">
      <select id="adb" style="flex:.8"><option value="0">자산</option><option value="1">부채</option></select>
      <button id="aadd">추가</button>
    </div>
  </div>
</div>
<button class="fab" id="fab" aria-label="내역 추가">+</button>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="seg"><button id="tE" class="on">지출</button><button id="tI">수입</button></div>
    <input id="amt" type="number" inputmode="numeric" placeholder="금액 (원)">
    <div class="lb">카테고리</div>
    <div class="chips" id="chips"></div>
    <div id="payBox">
      <div class="lb">결제 수단</div>
      <div class="chips" id="payChips"></div>
      <div id="cardBox"><div class="lb">카드 선택</div><div class="chips" id="cardChips"></div></div>
      <div id="instBox" class="hide"><div class="lb">할부 개월</div><select id="inst"><option value="1">일시불</option><option value="2">2개월</option><option value="3">3개월</option><option value="4">4개월</option><option value="5">5개월</option><option value="6">6개월</option><option value="7">7개월</option><option value="8">8개월</option><option value="9">9개월</option><option value="10">10개월</option><option value="12">12개월</option><option value="18">18개월</option><option value="24">24개월</option><option value="36">36개월</option></select></div>
    </div>
    <input id="memo" type="text" placeholder="메모 (선택)">
    <input id="date" type="date">
    <button class="save" id="save">저장</button>
  </div>
</div>

<div class="sheet top" id="msheet">
  <div class="panel">
    <b id="mtitle"></b>
    <div id="mlist" style="margin-top:6px"></div>
    <div class="addrow">
      <input id="mname" type="text" placeholder="이름">
      <select id="mkind" class="hide" style="flex:.7"><option value="체크">체크</option><option value="신용">신용</option></select>
      <button id="madd">추가</button>
    </div>
    <button class="save" id="mdone" style="margin-top:14px;background:var(--chip);color:var(--tx)">닫기</button>
  </div>
</div>

<script>
(function(){
var DEF={cats:{e:["식비","카페","교통","쇼핑","주거·통신","의료","문화·여가","기타"],i:["급여","용돈","기타수입"]},
 cards:[],assets:[{id:"a1",name:"현금",amt:0,debt:0},{id:"a2",name:"은행 계좌",amt:0,debt:0},{id:"a3",name:"예금·적금",amt:0,debt:0},{id:"a4",name:"투자",amt:0,debt:0}]};
var S={items:[],cats:clone(DEF.cats),cards:[],assets:clone(DEF.assets),ym:new Date(),type:"e",cat:"",pay:"cash",card:"",col:null,mode:"",loaded:false,showAll:false,billing:{pay:25,cut:11}};
S.ym.setDate(1);
var $=function(i){return document.getElementById(i)};
function clone(o){return JSON.parse(JSON.stringify(o))}
function won(n){return Math.round(n).toLocaleString("ko-KR")+"원"}
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function cardLabel(c){return c.name+" ("+c.kind+")"}

/* ---------- storage: private per-user db, fallback local ---------- */
function persistLocal(){try{localStorage.setItem("ledger-v2",JSON.stringify({items:S.items,cats:S.cats,cards:S.cards,assets:S.assets,billing:S.billing}))}catch(e){}}
async function saveSettings(){
  if(S.col){try{await S.col.doc("settings").set({cats:S.cats,cards:S.cards,assets:S.assets,billing:S.billing})}catch(e){alert("저장하지 못했어요. 쓰기 권한이 있는지 확인해주세요.")}}
  else persistLocal();
}
async function addTx(rec){
  if(S.col){try{await S.col.doc("t"+rec.id).set(rec)}catch(e){alert("저장하지 못했어요. 쓰기 권한이 있는지 확인해주세요.")}}
  else{S.items.push(rec);persistLocal();renderL()}
}
async function delTx(id){
  if(S.col){try{await S.col.doc("t"+id).delete()}catch(e){alert("삭제하지 못했어요.")}}
  else{S.items=S.items.filter(function(x){return x.id!==id});persistLocal();renderL()}
}

/* ---------- ledger ---------- */
function renderL(){
  var k=S.ym.getFullYear()+"-"+String(S.ym.getMonth()+1).padStart(2,"0");
  $("ml").textContent=S.ym.getFullYear()+"년 "+(S.ym.getMonth()+1)+"월";
  var its=S.items.filter(function(x){return (x.date||"").slice(0,7)===k})
    .sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0)});
  var inc=0,exp=0,cash=0,card=0,by={};
  its.forEach(function(x){
    if(x.type==="i")inc+=x.amount;
    else{exp+=x.amount;by[x.cat]=(by[x.cat]||0)+x.amount;if(x.pay==="card")card+=x.amount;else cash+=x.amount}
  });
  $("si").textContent=won(inc);$("se").textContent=won(exp);
  var b=inc-exp;$("bal").textContent=(b<0?"-":"")+won(Math.abs(b));$("bal").className="bal "+(b<0?"exp":"");
  $("pays").textContent="지출 중  현금 "+won(cash)+"  ·  카드 "+won(card);
  var cs=Object.keys(by).sort(function(a,c){return by[c]-by[a]}),mx=cs.length?by[cs[0]]:1;
  $("cats").innerHTML=cs.length?cs.map(function(c){
    return '<div class="cat"><div class="t"><span>'+esc(c)+'</span><b>'+won(by[c])+'</b></div><div class="bar"><i style="width:'+(by[c]/mx*100)+'%"></i></div></div>'}).join(""):'<div class="empty">아직 지출이 없어요</div>';
  var h="",last="";
  if(!its.length)h='<div class="card"><div class="empty">+ 버튼으로 첫 내역을 추가해보세요</div></div>';
  var shown=S.showAll?its:its.slice(0,10);
  shown.forEach(function(x){
    if(x.date!==last){if(last)h+="</div>";var d=new Date(x.date+"T00:00:00");
      h+='<div class="day">'+(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+"일월화수목금토"[d.getDay()]+')</div><div class="card">';last=x.date}
    var sub=x.type==="i"?"":(x.pay==="card"?(x.card||"카드")+(x.inst>1?" · "+x.inst+"개월 할부":""):"현금");
    h+='<div class="item"><div class="m"><div>'+esc(x.cat)+(x.memo?" · "+esc(x.memo):"")+'</div>'+(sub?'<div>'+esc(sub)+'</div>':"")+'</div><div class="a '+(x.type==="i"?"inc":"exp")+'">'+(x.type==="i"?"+":"-")+won(x.amount)+'</div><button class="x" data-id="'+esc(x.id)+'" aria-label="삭제">×</button></div>';
  });
  if(last)h+="</div>";
  if(its.length>10)h+='<button class="more" data-more="1">'+(S.showAll?"접기":"더 보기 ("+(its.length-10)+"건)")+'</button>';
  $("list").innerHTML=h;
  $("xM").textContent=(S.ym.getMonth()+1)+"월 내역 엑셀로 저장";
  renderSched();
}

/* ---------- credit card schedule ---------- */
function renderSched(){
  var p=S.billing.pay,c=S.billing.cut,now=new Date(),N=7,tot=[],i;
  for(i=0;i<N;i++)tot.push(0);
  var cur=now.getFullYear()*12+now.getMonth(),base=now.getDate()>p?cur+1:cur;
  S.items.forEach(function(x){
    if(x.type!=="e"||x.pay!=="card"||(x.card||"").indexOf("(신용)")<0||!x.date)return;
    var n=x.inst>1?x.inst:1,d=x.date.split("-"),s=Number(d[0])*12+Number(d[1])-1+(Number(d[2])>c?1:0);
    var b=Math.floor(x.amount/n),r=x.amount-b*n;
    for(var k=0;k<n;k++){var idx=s+k-base;if(idx<0||idx>=N)continue;tot[idx]+=b+(k===0?r:0)}
  });
  var sum=tot.reduce(function(a,b){return a+b},0);
  var h='<details'+(S.billOpen?' open':'')+' style="padding:8px 0;border-bottom:1px solid var(--line)"><summary style="font-size:13px;color:var(--mut);cursor:pointer">결제일 설정 · 매월 '+p+'일 결제 (마감 '+c+'일)</summary><div style="display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;margin-top:8px">결제일<input id="bp" type="number" inputmode="numeric" min="1" max="28" value="'+p+'" style="width:56px;margin:0;padding:6px 8px">일 · 집계 마감<input id="bc" type="number" inputmode="numeric" min="1" max="28" value="'+c+'" style="width:56px;margin:0;padding:6px 8px">일</div></details>';
  if(!sum){$("sched").innerHTML=h+'<div class="empty">결제 예정인 신용카드 내역이 없어요</div>';return}
  for(i=0;i<N;i++){
    var m=base+i,pm=m-1;
    var lab=(m%12+1)+"월 "+p+"일 결제"+(i===0?" (다음 결제)":"");
    var per=(pm%12+1)+"/"+(c+1)+" ~ "+(m%12+1)+"/"+c+" 이용분";
    h+='<div class="cat"><div class="t"><span>'+lab+'</span><b>'+(tot[i]?won(tot[i]):"-")+'</b></div><div style="color:var(--mut);font-size:12px">'+per+'</div></div>';
  }
  $("sched").innerHTML=h;
}
$("sched").addEventListener("toggle",function(e){S.billOpen=e.target.open},true);
$("sched").onchange=function(e){
  var id=e.target.id;if(id!=="bp"&&id!=="bc")return;
  var v=Math.min(28,Math.max(1,Math.round(Number(e.target.value))||1));
  if(id==="bp")S.billing.pay=v;else S.billing.cut=v;
  saveSettings();renderSched();
};

/* ---------- assets ---------- */
function renderA(){
  var a=0,d=0;S.assets.forEach(function(x){if(x.debt)d+=x.amt;else a+=x.amt});
  var n=a-d;$("net").textContent=(n<0?"-":"")+won(Math.abs(n));$("net").className="bal "+(n<0?"exp":"");
  $("aT").textContent=won(a);$("dT").textContent=won(d);
  $("alist").innerHTML=S.assets.length?S.assets.map(function(x){
    return '<div class="arow"><input class="nm" data-f="name" data-id="'+x.id+'" value="'+esc(x.name)+'">'+(x.debt?'<span class="tag">부채</span>':"")+
      '<input class="vl" type="number" inputmode="numeric" data-f="amt" data-id="'+x.id+'" value="'+x.amt+'"><button class="x" data-del="'+x.id+'" aria-label="삭제">×</button></div>'}).join(""):'<div class="empty">항목을 추가해보세요</div>';
}
$("alist").onchange=function(e){
  var id=e.target.getAttribute("data-id"),f=e.target.getAttribute("data-f");if(!id)return;
  var x=S.assets.filter(function(y){return y.id===id})[0];if(!x)return;
  if(f==="amt")x.amt=Math.max(0,Math.round(Number(e.target.value))||0);else x.name=e.target.value.trim()||x.name;
  saveSettings();renderA();
};
$("alist").onclick=function(e){
  var id=e.target.getAttribute("data-del");if(!id)return;
  if(!confirm("이 항목을 삭제할까요?"))return;
  S.assets=S.assets.filter(function(y){return y.id!==id});saveSettings();renderA();
};
$("aadd").onclick=function(){
  var nm=$("anm").value.trim();if(!nm){$("anm").focus();return}
  S.assets.push({id:uid(),name:nm,amt:Math.max(0,Math.round(Number($("aam").value))||0),debt:Number($("adb").value)});
  $("anm").value="";$("aam").value="";saveSettings();renderA();
};

/* ---------- add sheet ---------- */
function drawChips(){
  $("chips").innerHTML=S.cats[S.type].map(function(c){return '<button data-c="'+esc(c)+'" class="'+(c===S.cat?"on":"")+'">'+esc(c)+'</button>'}).join("")+'<button class="plus" data-m="cat">＋ 편집</button>';
  var ex=S.type==="e";$("payBox").classList.toggle("hide",!ex);
  $("payChips").innerHTML='<button data-p="cash" class="'+(S.pay==="cash"?"on":"")+'">현금</button><button data-p="card" class="'+(S.pay==="card"?"on":"")+'">카드</button>';
  $("cardBox").classList.toggle("hide",!(ex&&S.pay==="card"));
  var cc=S.cards.filter(function(c){return c.id===S.card})[0];
  $("instBox").classList.toggle("hide",!(ex&&S.pay==="card"&&cc&&cc.kind==="신용"));
  $("cardChips").innerHTML=S.cards.map(function(c){return '<button data-k="'+c.id+'" class="'+(c.id===S.card?"on":"")+'">'+esc(cardLabel(c))+'</button>'}).join("")+'<button class="plus" data-m="card">＋ 카드 등록</button>';
}
function setType(t){S.type=t;S.cat=S.cats[t][0]||"";$("tE").className=t==="e"?"on":"";$("tI").className=t==="i"?"on":"";drawChips()}
function openSheet(){$("amt").value="";$("memo").value="";$("date").value=iso(new Date());S.pay="cash";S.card=S.cards[0]?S.cards[0].id:"";$("inst").value="1";setType("e");$("sheet").classList.add("on");setTimeout(function(){$("amt").focus()},50)}
$("fab").onclick=openSheet;
$("sheet").onclick=function(e){if(e.target===$("sheet"))$("sheet").classList.remove("on")};
$("tE").onclick=function(){setType("e")};$("tI").onclick=function(){setType("i")};
$("sheet").addEventListener("click",function(e){
  var t=e.target,c=t.getAttribute("data-c"),p=t.getAttribute("data-p"),k=t.getAttribute("data-k"),m=t.getAttribute("data-m");
  if(c!==null){S.cat=c;drawChips()}
  else if(p){S.pay=p;if(p==="card"&&!S.card&&S.cards[0])S.card=S.cards[0].id;drawChips()}
  else if(k){S.card=k;drawChips()}
  else if(m)openManage(m);
});
$("save").onclick=function(){
  var amt=Math.round(Number($("amt").value));
  if(!amt||amt<=0){$("amt").focus();return}
  if(!S.cat){alert("카테고리를 먼저 추가해주세요.");return}
  var rec={id:uid(),type:S.type,amount:amt,cat:S.cat,memo:$("memo").value.trim().slice(0,60),date:$("date").value||iso(new Date()),ts:Date.now()};
  if(S.type==="e"){rec.pay=S.pay;if(S.pay==="card"){var c=S.cards.filter(function(x){return x.id===S.card})[0];rec.card=c?cardLabel(c):"카드";if(c&&c.kind==="신용")rec.inst=Number($("inst").value)||1}}
  $("sheet").classList.remove("on");
  addTx(rec);
};

/* ---------- manage categories / cards ---------- */
function openManage(m){S.mode=m;$("mtitle").textContent=m==="cat"?(S.type==="e"?"지출 카테고리 편집":"수입 카테고리 편집"):"카드 편집";
  $("mkind").classList.toggle("hide",m!=="card");$("mname").placeholder=m==="cat"?"새 카테고리 이름":"카드 이름 (예: 신한)";$("mname").value="";
  drawManage();$("msheet").classList.add("on")}
function drawManage(){
  var rows=S.mode==="cat"?S.cats[S.type].map(function(c,i){return [i,c]}):S.cards.map(function(c,i){return [i,cardLabel(c)]});
  $("mlist").innerHTML=rows.length?rows.map(function(r){return '<div class="mrow"><span>'+esc(r[1])+'</span><button class="x" data-i="'+r[0]+'" aria-label="삭제">×</button></div>'}).join(""):'<div class="empty">항목이 없어요</div>';
}
$("mlist").onclick=function(e){
  var i=e.target.getAttribute("data-i");if(i===null)return;i=Number(i);
  if(S.mode==="cat"){S.cats[S.type].splice(i,1);if(S.cat&&S.cats[S.type].indexOf(S.cat)<0)S.cat=S.cats[S.type][0]||""}
  else{var r=S.cards.splice(i,1)[0];if(r&&S.card===r.id)S.card=S.cards[0]?S.cards[0].id:""}
  saveSettings();drawManage();drawChips();
};
$("madd").onclick=function(){
  var n=$("mname").value.trim();if(!n)return;
  if(S.mode==="cat"){if(S.cats[S.type].indexOf(n)<0){S.cats[S.type].push(n);S.cat=n}}
  else{var c={id:uid(),name:n,kind:$("mkind").value};S.cards.push(c);S.card=c.id;S.pay="card"}
  $("mname").value="";saveSettings();drawManage();drawChips();
};
$("mdone").onclick=function(){$("msheet").classList.remove("on")};
$("msheet").onclick=function(e){if(e.target===$("msheet"))$("msheet").classList.remove("on")};

/* ---------- nav ---------- */
$("prev").onclick=function(){S.showAll=false;S.ym.setMonth(S.ym.getMonth()-1);renderL()};
$("next").onclick=function(){S.showAll=false;S.ym.setMonth(S.ym.getMonth()+1);renderL()};
$("list").onclick=function(e){
  if(e.target.getAttribute("data-more")){S.showAll=!S.showAll;renderL();return}
  var id=e.target.getAttribute("data-id");if(id&&confirm("이 내역을 삭제할까요?"))delTx(id)};
function tab(a){$("pgL").classList.toggle("hide",a);$("pgA").classList.toggle("hide",!a);$("fab").classList.toggle("hide",a);$("tabL").className=a?"":"on";$("tabA").className=a?"on":""}
$("tabL").onclick=function(){tab(false)};$("tabA").onclick=function(){tab(true)};

/* ---------- export / backup ---------- */
async function saveFile(name,blob){
  var dl=null;
  try{dl=await claude.use("downloads")}catch(e){}
  if(dl){try{await dl.save({filename:name,data:blob})}catch(e){if(!e||e.code!=="declined")alert("저장하지 못했어요.")}return}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
var GREEN="FF2F7D5B",RED="FFD2574A",LINE="FFE6E4DC",ZEBRA="FFF6F5F1",CHIP="FFEEF0EA",WHITE="FFFFFFFF";
var MONEY='#,##0"원";[Red]-#,##0"원"';
function fnt(o){return Object.assign({name:"맑은 고딕",size:11},o||{})}
function bd(){var s={style:"thin",color:{argb:LINE}};return {top:s,bottom:s,left:s,right:s}}
function fill(c,argb){c.fill={type:"pattern",pattern:"solid",fgColor:{argb:argb}}}
function cell(ws,r,c,v,o){
  o=o||{};var x=ws.getCell(r,c);x.value=v;x.font=fnt({bold:!!o.bold,color:o.color?{argb:o.color}:undefined});x.border=bd();
  x.alignment={vertical:"middle",horizontal:o.h||"left",wrapText:!!o.wrap};
  if(o.fmt)x.numFmt=o.fmt;if(o.bg)fill(x,o.bg);return x;
}
function head(ws,r,labels){labels.forEach(function(l,i){cell(ws,r,i+1,l,{bold:true,color:WHITE,bg:GREEN,h:"center"})});ws.getRow(r).height=22}
function title(ws,text,span){ws.mergeCells(1,1,1,span);var c=ws.getCell(1,1);c.value=text;c.font=fnt({bold:true,size:16,color:{argb:GREEN}});ws.getRow(1).height=30}
function newSheet(wb,name,widths,freeze){
  var ws=wb.addWorksheet(name,{views:[{state:freeze?"frozen":"normal",ySplit:freeze||0,showGridLines:false}]});
  widths.forEach(function(w,i){ws.getColumn(i+1).width=w});
  ws.pageSetup={paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0};return ws;
}
function sortTx(list){return list.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)})}
function sums(list){var i=0,e=0;list.forEach(function(x){if(x.type==="i")i+=x.amount;else e+=x.amount});return {i:i,e:e}}
function expBy(list){var by={};list.forEach(function(x){if(x.type==="e")by[x.cat]=(by[x.cat]||0)+x.amount});return by}
function colL(n){var s="";while(n>0){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26)}return s}

function monthSheet(wb,key,list){
  var rows=sortTx(list),last=Math.max(6+rows.length,7),t=sums(rows);
  var ws=newSheet(wb,key,[13,8,14,18,10,15,28],6);
  title(ws,key.slice(0,4)+"년 "+Number(key.slice(5))+"월 가계부",7);
  var rg=function(c){return "$"+c+"$7:$"+c+"$"+last};
  [["수입",t.i,GREEN],["지출",t.e,RED]].forEach(function(s,k){
    var r=2+k;cell(ws,r,1,s[0],{bold:true,bg:CHIP,h:"center"});cell(ws,r,3,null);ws.mergeCells(r,2,r,3);
    cell(ws,r,2,{formula:"SUMIFS("+rg("F")+","+rg("B")+',"'+s[0]+'")',result:s[1]},{bold:true,color:s[2],h:"right",fmt:MONEY});
  });
  cell(ws,4,1,"잔액",{bold:true,bg:CHIP,h:"center"});cell(ws,4,3,null);ws.mergeCells(4,2,4,3);
  cell(ws,4,2,{formula:"B2-B3",result:t.i-t.e},{bold:true,h:"right",fmt:MONEY});
  head(ws,6,["날짜","구분","카테고리","결제수단","할부","금액","메모"]);
  rows.forEach(function(x,k){
    var r=7+k,p=x.date.split("-"),inc=x.type==="i",bg=k%2?ZEBRA:null,col=inc?GREEN:RED;
    cell(ws,r,1,new Date(Date.UTC(+p[0],+p[1]-1,+p[2])),{h:"center",fmt:"yyyy-mm-dd",bg:bg});
    cell(ws,r,2,inc?"수입":"지출",{h:"center",color:col,bold:true,bg:bg});
    cell(ws,r,3,x.cat,{bg:bg});
    cell(ws,r,4,inc?"":(x.pay==="card"?(x.card||"카드"):"현금"),{bg:bg});
    cell(ws,r,5,x.inst>1?x.inst+"개월":"",{h:"center",bg:bg});
    cell(ws,r,6,x.amount,{h:"right",fmt:'#,##0"원"',color:col,bg:bg});
    cell(ws,r,7,x.memo||"",{wrap:true,bg:bg});
  });
  if(rows.length)ws.autoFilter={from:{row:6,column:1},to:{row:last,column:7}};
}
function catSheet(wb,key,list){
  var by=expBy(list),cs=Object.keys(by).sort(function(a,b){return by[b]-by[a]});if(!cs.length)return;
  var tot=cs.reduce(function(s,c){return s+by[c]},0),end=3+cs.length,q="'"+key+"'!";
  var ws=newSheet(wb,"카테고리별",[16,16,10,34]);
  title(ws,key.slice(0,4)+"년 "+Number(key.slice(5))+"월 카테고리별 지출",4);
  head(ws,3,["카테고리","지출 금액","비중","그래프"]);
  cs.forEach(function(c,k){
    var r=4+k,bg=k%2?ZEBRA:null,n=Math.round(by[c]/tot*25);
    cell(ws,r,1,c,{bg:bg});
    cell(ws,r,2,{formula:"SUMIFS("+q+"$F:$F,"+q+"$C:$C,A"+r+","+q+'$B:$B,"지출")',result:by[c]},{h:"right",fmt:'#,##0"원"',bg:bg});
    cell(ws,r,3,{formula:"B"+r+"/$B$"+(end+1),result:by[c]/tot},{h:"center",fmt:"0.0%",bg:bg});
    cell(ws,r,4,{formula:'REPT("■",ROUND(C'+r+"*25,0))",result:new Array(n+1).join("■")},{color:GREEN,bg:bg});
  });
  cell(ws,end+1,1,"합계",{bold:true,bg:CHIP,h:"center"});
  cell(ws,end+1,2,{formula:"SUM(B4:B"+end+")",result:tot},{bold:true,bg:CHIP,h:"right",fmt:'#,##0"원"'});
  cell(ws,end+1,3,{formula:"SUM(C4:C"+end+")",result:1},{bold:true,bg:CHIP,h:"center",fmt:"0.0%"});
  cell(ws,end+1,4,null,{bg:CHIP});
}
function summarySheets(wb,keys,ms){
  var ws=newSheet(wb,"요약",[14,16,16,16]);title(ws,"가계부 요약",4);head(ws,3,["월","수입","지출","잔액"]);
  var ti=0,te=0,n=keys.length;
  keys.forEach(function(k,j){var s=sums(ms[k]),r=4+j,bg=j%2?ZEBRA:null;ti+=s.i;te+=s.e;
    cell(ws,r,1,k,{h:"center",bg:bg});cell(ws,r,2,s.i,{h:"right",fmt:MONEY,color:GREEN,bg:bg});cell(ws,r,3,s.e,{h:"right",fmt:MONEY,color:RED,bg:bg});
    cell(ws,r,4,{formula:"B"+r+"-C"+r,result:s.i-s.e},{h:"right",fmt:MONEY,bold:true,bg:bg})});
  var t=4+n;cell(ws,t,1,"합계",{bold:true,bg:CHIP,h:"center"});
  [["B",ti],["C",te]].forEach(function(a,j){cell(ws,t,2+j,{formula:"SUM("+a[0]+"4:"+a[0]+(t-1)+")",result:a[1]},{bold:true,bg:CHIP,h:"right",fmt:MONEY})});
  cell(ws,t,4,{formula:"B"+t+"-C"+t,result:ti-te},{bold:true,bg:CHIP,h:"right",fmt:MONEY});
  var all={};keys.forEach(function(k){var b=expBy(ms[k]);Object.keys(b).forEach(function(c){all[c]=1})});
  var cs=Object.keys(all),w2=newSheet(wb,"카테고리별 지출",[16].concat(keys.map(function(){return 13}),[15]));
  title(w2,"월별 카테고리별 지출",keys.length+2);head(w2,3,["카테고리"].concat(keys,["합계"]));
  var bys=keys.map(function(k){return expBy(ms[k])}),cT=keys.length+2;
  cs.forEach(function(c,j){var r=4+j,bg=j%2?ZEBRA:null,sm=0;cell(w2,r,1,c,{bg:bg});
    keys.forEach(function(k,m){var v=bys[m][c]||0;sm+=v;cell(w2,r,2+m,v||null,{h:"right",fmt:'#,##0',bg:bg})});
    cell(w2,r,cT,{formula:"SUM(B"+r+":"+colL(cT-1)+r+")",result:sm},{h:"right",bold:true,fmt:'#,##0"원"',bg:bg})});
  var tr=4+cs.length;cell(w2,tr,1,"합계",{bold:true,bg:CHIP,h:"center"});
  for(var c=2;c<=cT;c++){var tv=0;if(c<cT)bys[c-2]&&Object.keys(bys[c-2]).forEach(function(z){tv+=bys[c-2][z]});else tv=te;
    cell(w2,tr,c,{formula:"SUM("+colL(c)+"4:"+colL(c)+(tr-1)+")",result:tv},{bold:true,bg:CHIP,h:"right",fmt:'#,##0'})}
}
function assetSheet(wb){
  var ws=newSheet(wb,"자산",[22,10,18]),a=0,d=0;title(ws,"보유 자산 현황 ("+iso(new Date())+" 기준)",3);head(ws,3,["항목","구분","금액"]);
  S.assets.forEach(function(x,j){var r=4+j,bg=j%2?ZEBRA:null;if(x.debt)d+=x.amt;else a+=x.amt;
    cell(ws,r,1,x.name,{bg:bg});cell(ws,r,2,x.debt?"부채":"자산",{h:"center",bg:bg,color:x.debt?RED:GREEN});cell(ws,r,3,x.amt,{h:"right",fmt:'#,##0"원"',bg:bg})});
  var e=3+S.assets.length;
  [["자산 합계",'"자산"',a],["부채 합계",'"부채"',d]].forEach(function(s,j){var r=e+1+j;cell(ws,r,1,s[0],{bold:true,bg:CHIP});cell(ws,r,2,null,{bg:CHIP});
    cell(ws,r,3,{formula:"SUMIFS(C4:C"+e+",B4:B"+e+","+s[1]+")",result:s[2]},{bold:true,bg:CHIP,h:"right",fmt:'#,##0"원"'})});
  cell(ws,e+3,1,"순자산",{bold:true,bg:CHIP});cell(ws,e+3,2,null,{bg:CHIP});
  cell(ws,e+3,3,{formula:"C"+(e+1)+"-C"+(e+2),result:a-d},{bold:true,bg:CHIP,h:"right",fmt:MONEY});
}
function needXlsx(){if(window.ExcelJS)return false;alert("엑셀 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해주세요.");return true}
async function xlsxSave(wb,name){
  var buf=await wb.xlsx.writeBuffer();
  saveFile(name,new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}
function newBook(){var wb=new ExcelJS.Workbook();wb.creator="내 가계부";wb.created=new Date();return wb}
function exportMonth(){
  if(needXlsx())return;
  var k=S.ym.getFullYear()+"-"+String(S.ym.getMonth()+1).padStart(2,"0");
  var list=S.items.filter(function(x){return (x.date||"").slice(0,7)===k});
  if(!list.length){alert("이 달에는 내역이 없어요.");return}
  var wb=newBook();monthSheet(wb,k,list);catSheet(wb,k,list);xlsxSave(wb,"가계부_"+k+".xlsx");
}
function exportAll(){
  if(needXlsx())return;
  var ms={};S.items.forEach(function(x){if(x.date)(ms[x.date.slice(0,7)]=ms[x.date.slice(0,7)]||[]).push(x)});
  var keys=Object.keys(ms).sort();
  if(!keys.length){alert("내보낼 내역이 없어요.");return}
  var wb=newBook();summarySheets(wb,keys,ms);assetSheet(wb);
  keys.forEach(function(k){monthSheet(wb,k,ms[k])});
  xlsxSave(wb,"가계부_전체_"+iso(new Date())+".xlsx");
}
function backup(){
  var o={v:2,items:S.items,cats:S.cats,cards:S.cards,assets:S.assets,billing:S.billing};
  saveFile("가계부_백업_"+iso(new Date())+".json",new Blob([JSON.stringify(o)],{type:"application/json"}));
}
async function restore(file){
  var o;try{o=JSON.parse(await file.text())}catch(e){alert("백업 파일을 읽지 못했어요.");return}
  if(!o||!Array.isArray(o.items)){alert("올바른 백업 파일이 아니에요.");return}
  if(!confirm("백업 파일을 불러올까요? 없는 내역만 추가되고, 카테고리·카드·자산·결제일 설정은 백업 내용으로 바뀔어요."))return;
  applySettings(o);
  var have={};S.items.forEach(function(x){have[x.id]=1});
  var add=o.items.filter(function(x){return x&&x.id&&!have[x.id]&&x.date&&x.amount>0});
  if(S.col){
    for(var i=0;i<add.length;i++){try{await S.col.doc("t"+add[i].id).set(add[i])}catch(e){alert("일부 내역을 저장하지 못했어요.");break}}
    await saveSettings();
  }else{S.items=S.items.concat(add);persistLocal()}
  renderL();renderA();alert(add.length+"건을 불러왔어요.");
}
$("xM").onclick=exportMonth;$("xA").onclick=exportAll;$("xB").onclick=backup;
$("xR").onclick=function(){$("xF").click()};
$("xF").onchange=function(e){var f=e.target.files[0];e.target.value="";if(f)restore(f)};

/* ---------- init ---------- */
function applySettings(s){
  if(s.cats)S.cats=s.cats;if(s.cards)S.cards=s.cards;if(s.assets)S.assets=s.assets;if(s.billing)S.billing=s.billing;
}
async function init(){
  renderL();renderA();
  var db=null,user=null,id=null;
  try{user=await claude.use("user");if(user)id=await user.id();db=await claude.use("db")}catch(e){}
  if(db&&id){
    S.col=db.collection("data/users/"+id);
    S.col.onSnapshot(function(snap){
      var items=[];
      snap.docs.forEach(function(d){
        if(d.id==="settings")applySettings(d.data()||{});
        else if(d.id.charAt(0)==="t"){var o=Object.assign({},d.data());o.id=d.id.slice(1);items.push(o)}
      });
      S.items=items;renderL();renderA();
    },function(){$("note").innerHTML='<div class="note">데이터를 불러오지 못했어요. 새로고침 해주세요.</div>'});
  }else{
    try{var raw=localStorage.getItem("ledger-v2");if(raw){var o=JSON.parse(raw);S.items=o.items||[];applySettings(o)}}catch(e){}
        renderL();renderA();
  }
}
init();
})();
